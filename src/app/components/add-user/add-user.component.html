<form [formGroup]="userForm" (ngSubmit)="onSubmit()" novalidate>
  <div>
    <label for="name">Name</label>
    <input id="name" formControlName="name" />
    <div *ngIf="userForm.get('name')?.touched && userForm.get('name')?.invalid">
      <small *ngIf="userForm.get('name')?.errors?.required">Name is required.</small>
    </div>
  </div>

  <div>
    <label for="age">Age</label>
    <input id="age" type="number" formControlName="age" />
    <div *ngIf="userForm.get('age')?.touched && userForm.get('age')?.invalid">
      <small *ngIf="userForm.get('age')?.errors?.required">Age is required.</small>
      <small *ngIf="userForm.get('age')?.errors?.min">Age must be 0 or greater.</small>
    </div>
  </div>

  <div>
    <label for="city">City</label>
    <input id="city" formControlName="city" />
    <div *ngIf="userForm.get('city')?.touched && userForm.get('city')?.invalid">
      <small *ngIf="userForm.get('city')?.errors?.required">City is required.</small>
    </div>
  </div>

  <div>
    <label for="state">State</label>
    <input id="state" formControlName="state" />
    <div *ngIf="userForm.get('state')?.touched && userForm.get('state')?.invalid">
      <small *ngIf="userForm.get('state')?.errors?.required">State is required.</small>
    </div>
  </div>

  <div>
    <label for="pincode">Pincode</label>
    <input id="pincode" formControlName="pincode" />
    <div *ngIf="userForm.get('pincode')?.touched && userForm.get('pincode')?.invalid">
      <small *ngIf="userForm.get('pincode')?.errors?.required">Pincode is required.</small>
      <small *ngIf="userForm.get('pincode')?.errors?.pattern">Pincode must be 4 to 6 digits.</small>
    </div>
  </div>

  <div>
    <button type="submit">Add User</button>
  </div>

  <div *ngIf="successMessage" style="color:green;margin-top:8px;">
    {{ successMessage }}
  </div>
  <div *ngIf="errorMessage" style="color:red;margin-top:8px;">
    {{ errorMessage }}
  </div>
</form>
